<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Sho'r Radar</title>
<meta name="theme-color" content="#F3F6F4">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/img/app-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Brand palette sampled from the Sho'r Radar logo: ink #0E2A2E, field green #2EA05A, amber #F2B01E, alert red #DA3A2C, wordmark green #1D7A45 */
:root{
  --bg:#F3F6F4; --card:#FFFFFF; --ink:#0E2A2E; --muted:#566F73; --line:rgba(14,42,46,.10); --chip:#E6EDE9;
  --brand:#1D7A45; --green:#2EA05A; --amber:#F2B01E; --red:#DA3A2C; --blue:#2D7FD0; --mint:#6FD59B; --ring:#0E2A2E;
  --on-brand:#fff; --shadow:0 1px 2px rgba(14,42,46,.06),0 6px 18px rgba(14,42,46,.06);
}
:root[data-theme="dark"]{
  --bg:#0A1C1F; --card:#0E2A2E; --ink:#F6F3EA; --muted:#8FA7AA; --line:rgba(246,243,234,.10); --chip:#153A3F;
  --brand:#6FD59B; --ring:#F6F3EA; --on-brand:#0A1C1F; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 16px}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .in{max-width:600px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-size:19px;letter-spacing:-.02em;flex:1}
.brand b{font-weight:800} .brand span{font-weight:400;color:var(--brand)} .center .brand{justify-content:center}
.iconbtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;padding:0;color:var(--ink);cursor:pointer}
h1{font-size:24px;line-height:1.15;margin:18px 0 6px;letter-spacing:-.025em;font-weight:800} h2{font-size:15px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14.5px} .small{font-size:13.5px;color:var(--muted)}
.iconbtn.lbl{width:auto;padding:0 13px;gap:6px;font-weight:700;font-size:14px;display:flex;align-items:center;white-space:nowrap}
.hero .do{font-size:17px;font-weight:700;margin:0 0 6px}
.hero .w .ico{font-size:34px;margin-right:6px}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bigbtns button{min-height:56px;font-size:15px;line-height:1.2}
.guide{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px} .guide:last-child{border:0}
.guide .gi{flex:none;width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;color:var(--brand)} .guide .gi svg{width:22px;height:22px}
.guide b{display:block}
.cta{background:linear-gradient(135deg,#14633A,#2EA05A);color:#fff;border:0} .cta h2{font-size:19px} .cta p{margin:0 0 12px;opacity:.95} .cta button{background:#fff;color:#14633A}
.alertbox{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,var(--card))}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--shadow)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:var(--brand);color:var(--on-brand);font-weight:700}
button.ghost{background:var(--chip);color:var(--ink)} button.danger{background:transparent;color:var(--red)} button.block{width:100%} button:disabled{opacity:.5}
button.mini{padding:8px 13px;font-size:13.5px;border-radius:11px;min-height:38px}
button:not(.mini):not(.iconbtn):not(.sw):not(.nav button){min-height:48px;font-size:15.5px}
button:active{transform:scale(.98)}
input,select,textarea{width:100%;font:inherit;font-size:16px;min-height:48px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:84px;resize:vertical} label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:600}
.row{display:flex;gap:8px;align-items:center} .row>*{flex:1} .between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px} .scroll{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none} .scroll::-webkit-scrollbar{display:none}
.chip{padding:10px 15px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer;border:1.5px solid transparent;flex:none}
.chip.on{background:var(--ink);color:var(--bg)} :root[data-theme="dark"] .chip.on{background:var(--mint);color:#0A1C1F}
.chip .pl{font-size:10px;font-weight:800;color:var(--amber);margin-left:5px;letter-spacing:.04em}
.chip.static{cursor:default}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;color:#fff;letter-spacing:.01em}
.lv-LOW,.t-good{background:var(--green)} .lv-MEDIUM,.t-marginal{background:var(--amber);color:#2a1f00} .lv-HIGH,.t-avoid{background:var(--red)}
.hero{border-radius:22px;padding:20px;color:#fff;margin:12px 0;position:relative;overflow:hidden}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .w{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:4px 0 8px} .hero p{margin:0;font-size:15.5px;opacity:.96}
.hero.IRRIGATE{background:linear-gradient(135deg,#1F5FA8,#2D7FD0)} .hero.MONITOR{background:linear-gradient(135deg,#B9820A,#E0A21A)} .hero.WAIT{background:linear-gradient(135deg,#14633A,#2EA05A)}
.hero .bg{position:absolute;right:-30px;top:-30px;opacity:.12}
.facts{display:grid;gap:8px;margin-top:14px;grid-template-columns:repeat(3,1fr)}
.fact{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px} .fact b{display:block;font-size:17px} .fact span{font-size:11px;opacity:.9;line-height:1.2;display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.tile .l{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center} .tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px} .tile .v small{font-size:13px;font-weight:600;color:var(--muted)}
.meter{height:10px;border-radius:6px;margin:12px 0 6px;position:relative;background:linear-gradient(90deg,var(--green) 0 35%,var(--amber) 35% 60%,var(--red) 60%)}
.meter i{position:absolute;top:-5px;width:4px;height:20px;background:var(--ink);border-radius:3px;transform:translateX(-2px);box-shadow:0 0 0 2px var(--card)}
.seg{display:flex;background:var(--chip);border-radius:13px;padding:3px} .seg button{flex:1;background:none;color:var(--muted);padding:7px 8px;font-size:13px;border-radius:10px} .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center} .fc div{font-size:11.5px;color:var(--muted)} .fc b{display:block;color:var(--ink);font-size:13px}
.fc .bar{height:46px;display:flex;align-items:flex-end;justify-content:center} .fc .bar i{display:block;width:60%;border-radius:4px 4px 0 0;background:var(--blue);min-height:2px}
.log{display:flex;gap:6px;flex-wrap:wrap} .evt{font-size:13px;color:var(--muted);padding:5px 0;border-bottom:1px dashed var(--line)} .evt:last-child{border:0}
.crop{display:grid;grid-template-columns:1fr auto;gap:2px 10px} .crop h3{margin:0;font-size:16px;font-weight:700} .crop .tolbar{grid-column:1/-1;margin-top:8px}
.tol{height:8px;border-radius:5px;background:var(--chip);position:relative} .tol i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--green)} .tol u{position:absolute;top:-4px;width:3px;height:16px;background:var(--ink);border-radius:2px;text-decoration:none}
.dots{letter-spacing:2px;color:var(--blue)} .dots s{text-decoration:none;color:var(--line)}
.warn{color:#B9820A;font-size:12.5px;font-weight:600;grid-column:1/-1;margin-top:4px}
.step{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px} .step:last-child{border:0} .step i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.month{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px} .month:last-child{border:0} .month b{min-width:36px;color:var(--brand)}
.post .meta{font-size:12px;color:var(--muted);margin-bottom:5px} .post p{margin:0 0 10px;white-space:pre-wrap;word-break:break-word} .post .acts{display:flex;gap:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
.nav .in{max-width:600px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 2px 9px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:24px;height:24px} .nav button.on{color:var(--brand);box-shadow:inset 0 3px 0 var(--brand)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,16,18,.55);display:flex;align-items:flex-end;z-index:30}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:6px 16px calc(22px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;font-weight:600;z-index:50;max-width:90%;box-shadow:var(--shadow)}
.skel{height:96px;border-radius:18px;background:linear-gradient(90deg,var(--chip),var(--line),var(--chip));background-size:200% 100%;animation:sh 1.2s infinite;margin:12px 0}
@keyframes sh{to{background-position:-200% 0}}
.mapwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line)} #map{height:calc(100dvh - 330px);min-height:340px;z-index:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px} .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.leaflet-popup-content-wrapper{border-radius:14px} .leaflet-popup-content{margin:12px 14px;font:13.5px Inter,system-ui,sans-serif}
.sw{width:48px;height:29px;border-radius:15px;background:var(--chip);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)} .sw.on{background:var(--green)} .sw.on::after{left:22px}
.center{text-align:center;padding:36px 10px} .center .logo{margin:0 auto 14px}
.pill{padding:15px 10px;min-height:52px;display:flex;flex-direction:column;justify-content:center;border-radius:14px;background:var(--chip);text-align:center;font-weight:700;cursor:pointer;border:2px solid transparent;font-size:14px}
.pill.on{border-color:var(--green);background:var(--card)} .pilot-star{color:#B9820A;font-size:11px;display:block;font-weight:800;letter-spacing:.04em}
pre{white-space:pre-wrap;font:inherit;margin:0} a{color:var(--brand);font-weight:600}
svg text{font-family:Inter,system-ui,sans-serif}
details.sec{padding:0} details.sec>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px;min-height:54px;font-weight:700;font-size:15px}
details.sec>summary::-webkit-details-marker{display:none} .sec .secbody{padding:0 16px 16px} .sec .r{display:flex;gap:8px;align-items:center}
.chev{font-style:normal;font-size:22px;line-height:1;color:var(--muted);transition:transform .15s} details[open] .chev{transform:rotate(90deg)}
table.tr{width:100%;border-collapse:collapse;font-size:13px} .tr td,.tr th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tr th{color:var(--muted);font-weight:600;font-size:11.5px} .tr tr.dec{background:color-mix(in srgb,var(--green) 14%,transparent)} .tr tr.hit td:first-child{font-weight:600}
#offbar{background:var(--amber);color:#2a1f00;text-align:center;font-size:12.5px;font-weight:700;padding:6px 10px}
.vbadge{display:inline-block;background:var(--green);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:2px 8px;margin-left:6px}
.src{padding:9px 0;border-bottom:1px dashed var(--line)} .src:last-child{border:0}
details.more{border:1px dashed var(--line);border-radius:14px;margin-top:16px;background:transparent;box-shadow:none}
details.more>summary{list-style:none;cursor:pointer;padding:14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
details.more>summary::-webkit-details-marker{display:none} details.more[open] .chev{transform:rotate(90deg)}
details.more .secbody{padding:0 14px 14px}
.step3{display:flex;gap:6px;margin:4px 0 14px} .step3 i{flex:1;height:5px;border-radius:3px;background:var(--line)} .step3 i.on{background:var(--brand)}
</style>
</head>
<body>
<header><div class="in" id="hdr"></div></header>
<div id="offbar" hidden></div>
<div id="app" class="wrap"></div>
<nav class="nav" id="nav" hidden><div class="in" id="navin"></div></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
const tg = window.Telegram && Telegram.WebApp;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = { boot: null, lang: "uz", tab: "home", ctx: null, trend: 30, layer: "map", ndvi: false, step: "lang", cache: {}, rid: 0, map: null, pickRegion: null };

/* ---------- theme ---------- */
function themePref() { try { return JSON.parse(localStorage.getItem("sr:theme")) || "light"; } catch (e) { return "light"; } }   // default: light
function applyTheme() {
  const pref = themePref();
  const dark = pref === "dark" || (pref === "auto" && (tg ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const col = dark ? "#0A1C1F" : "#F3F6F4";
  const mc = document.querySelector('meta[name="theme-color"]'); if (mc) mc.content = col;
  if (tg) { try { tg.setHeaderColor(col); tg.setBackgroundColor(col); tg.setBottomBarColor && tg.setBottomBarColor(dark ? "#0E2A2E" : "#FFFFFF"); } catch (e) {} }
}
const THEME_L = { light: { uz: "☀️ Yorug'", ru: "☀️ Светлая", en: "☀️ Light" }, dark: { uz: "🌙 Qorong'i", ru: "🌙 Тёмная", en: "🌙 Dark" }, auto: { uz: "📱 Avto", ru: "📱 Авто", en: "📱 Auto" }, title: { uz: "Mavzu", ru: "Тема", en: "Theme" } };
const TL = k => THEME_L[k][S.lang] || THEME_L[k].en;
applyTheme();
if (tg) { tg.ready(); tg.expand(); tg.onEvent("themeChanged", () => { applyTheme(); }); }

/* ---------- helpers ---------- */
const T = (k, p = {}) => { const e = S.boot.i18n[k]; let s = (e && (e[S.lang] || e.en)) || k; for (const a in p) s = s.replaceAll("{" + a + "}", p[a]); return s; };
const meta = () => S.boot.meta;
const nm = (tbl, key) => { const e = meta()[tbl][key]; return e ? (e[S.lang] || e.en) : key; };
const regionName = id => { const r = meta().regions.find(r => r.id === id); return r ? (r.name[S.lang] || r.name.en) : "-"; };
const LOC = { uz: "uz-UZ", ru: "ru-RU", en: "en-GB" };
const fmtDate = iso => iso ? new Date(iso + "T00:00:00").toLocaleDateString(LOC[S.lang] || "en-GB", { day: "numeric", month: "short", year: "numeric" }) : "–";
const fmtDay = iso => new Date(iso + "T00:00:00").toLocaleDateString(LOC[S.lang] || "en-GB", { weekday: "short" });
const pct = v => v == null ? "–" : Math.round(v * 100);
const num = (v, d = 1) => v == null ? "–" : (+v).toFixed(d).replace(/\.0$/, "");
function toast(msg) { const d = document.createElement("div"); d.className = "toast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
const haptic = t => { try { tg && tg.HapticFeedback.notificationOccurred(t || "success"); } catch (e) {} };
const confirmBox = (msg, cb) => (tg && tg.showConfirm) ? tg.showConfirm(msg, ok => ok && cb()) : (confirm(msg) && cb());
const openLink = url => (tg && tg.openLink) ? tg.openLink(url) : window.open(url, "_blank");

const LS = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const uidKey = () => (tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : "x");
function syncBanner() {
  const el = $("#offbar"); if (!el) return;
  if (S.offlineAt && S.boot) { el.hidden = false; el.textContent = "📡 " + T("a_offline", { t: new Date(S.offlineAt).toLocaleString(LOC[S.lang] || "en-GB", { dateStyle: "medium", timeStyle: "short" }) }); } else el.hidden = true;
}
async function api(path, method = "GET", body, timeoutMs = 30000) {
  // timeout + one automatic retry for reads; if the network is down, reads fall back to the copy saved on this phone
  const attempts = method === "GET" ? 2 : 1, key = `sr:${uidKey()}:${path}`;
  let lastErr;
  for (let i = 0; i < attempts; i++) {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      const r = await fetch("/api/app" + path, { method, signal: ctl.signal, headers: { "Content-Type": "application/json", "X-Init-Data": tg ? tg.initData : "" }, body: body ? JSON.stringify(body) : undefined });
      if (r.ok) {
        const d = await r.json();
        if (method === "GET") { LS.set(key, { t: Date.now(), d }); if (S.offlineAt) { S.offlineAt = null; syncBanner(); } }
        return d;
      }
      let m = ""; try { m = (await r.json()).detail; } catch (e) {}
      lastErr = new Error(typeof m === "string" && m ? m : r.status);
      if (r.status < 500) { lastErr.fatal = true; throw lastErr; }
    } catch (e) { lastErr = e.name === "AbortError" ? new Error("timeout") : e; if (lastErr.fatal) break; }
    finally { clearTimeout(timer); }
    if (i < attempts - 1) await new Promise(res => setTimeout(res, 1200));
  }
  if (method === "GET" && !(lastErr && lastErr.fatal)) { const c = LS.get(key); if (c) { S.offlineAt = c.t; syncBanner(); return c.d; } }
  throw lastErr;
}

/* ---------- logo (recreated from the brand mark) ---------- */
function mark(size = 30) {
  const id = "c" + Math.random().toString(36).slice(2, 7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="${id}"><circle cx="50" cy="50" r="40.8"/></clipPath></defs>
  <circle cx="50" cy="50" r="46" fill="var(--ring)"/><g clip-path="url(#${id})"><rect width="100" height="100" fill="#2EA05A"/>
  <polygon points="53.2,9 86,29.3 57.6,44.4" fill="#F7CE74"/><polygon points="57.6,44.4 86,29.3 92,50 64,55.9" fill="#F2B01E"/>
  <polygon points="62.5,56.2 92,50 92,66 67.4,88 58.6,78.1" fill="#DA3A2C"/><polygon points="10.9,61.7 32.4,57.6 38.3,79.9 26.2,83" fill="#F2B01E"/>
  <polygon points="49.4,9 53.2,9 56,45 50,50" fill="#fff" opacity=".35"/>

/* ---------- context (field or district) ---------- */
const ctxKey = c => c.type + ":" + c.id;
const ctxPath = c => c.type === "field" ? `/fields/${c.id}` : `/area/${c.id}`;
function defaultCtx() {
  const f = S.boot.fields[0];
  if (f) return { type: "field", id: f.id };
  const r = S.boot.user.region;
  return { type: "area", id: r || meta().pilots[0] };
}
function ensureCtx() {
  if (!S.ctx) S.ctx = defaultCtx();
  if (S.ctx.type === "field" && !S.boot.fields.find(f => f.id === S.ctx.id)) S.ctx = defaultCtx();
}
async function getData(kind, force = false) {
  const key = ctxKey(S.ctx) + ":" + kind;
  const hit = S.cache[key];
  if (!force && hit && Date.now() - hit.t < 5 * 60 * 1000) return hit.d;
  const d = await api(ctxPath(S.ctx) + "/" + kind + (force && kind === "status" ? "?refresh=true" : ""));
  S.cache[key] = { t: Date.now(), d };
  return d;
}
const dropCache = () => { S.cache = {}; };

/* Picker: my fields first (one tap each), "+ Field", and one "Other area" chip that reveals the area list. */
function ctxBar() {

/* ---------- charts (plain SVG, no library) ---------- */
function chart({ data, kind = "line", color = "#2EA05A", h = 96, min = null, max = null, lines = [], fmt = v => num(v) }) {
  const w = 320, pad = { l: 6, r: 6, t: 8, b: 18 }, n = data.length;
  const vals = data.map(d => d.v).filter(v => v != null);
  if (!vals.length) return `<div class="small">–</div>`;
  const lo = min ?? Math.min(...vals), hi = max ?? Math.max(...vals, lo + 0.0001);
  const X = i => pad.l + (n === 1 ? 0 : i * (w - pad.l - pad.r) / (n - 1)), Y = v => pad.t + (1 - (v - lo) / (hi - lo || 1)) * (h - pad.t - pad.b);
  let body = "";
  lines.forEach(l => { if (l.v >= lo && l.v <= hi) body += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(l.v)}" y2="${Y(l.v)}" stroke="${l.c}" stroke-dasharray="4 4" stroke-width="1"/>`; });
  if (kind === "bar") {
    const bw = Math.max(1.5, (w - pad.l - pad.r) / n - 1.5);
    data.forEach((d, i) => { if (d.v > 0) body += `<rect x="${X(i) - bw / 2}" y="${Y(d.v)}" width="${bw}" height="${Y(lo) - Y(d.v)}" rx="1.5" fill="${color}"/>`; });
  } else {
    let path = "", started = false, area = "";
    data.forEach((d, i) => { if (d.v == null) { started = false; return; } path += (started ? "L" : "M") + X(i).toFixed(1) + " " + Y(d.v).toFixed(1); started = true; });
    area = path + `L${X(n - 1)} ${Y(lo)}L${X(0)} ${Y(lo)}Z`;
    body += `<path d="${area}" fill="${color}" opacity=".12"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  const last = data.filter(d => d.v != null).slice(-1)[0];
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">${body}
    <line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(lo)}" y2="${Y(lo)}" stroke="var(--line)"/>
    <text x="${pad.l}" y="${h - 4}" font-size="10" fill="var(--muted)">${esc(fmtDate(data[0].d).replace(/ \d{4}$/, ""))}</text>
    <text x="${w - pad.r}" y="${h - 4}" font-size="10" fill="var(--muted)" text-anchor="end">${esc(fmtDate(data[n - 1].d).replace(/ \d{4}$/, ""))}</text>
    <text x="${pad.l}" y="10" font-size="10.5" font-weight="700" fill="var(--ink)">${last ? esc(fmt(last.v)) : ""}</text></svg>`;
}
function gauge(v) {
  const th = meta().thresholds, R = 74, cx = 100, cy = 94;
  const pt = (f, r = R) => [cx - r * Math.cos(Math.PI * f), cy - r * Math.sin(Math.PI * f)];
  const seg = (a, b, c) => { const [x0, y0] = pt(a), [x1, y1] = pt(b); return `<path d="M${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}" fill="none" stroke="${c}" stroke-width="15"/>`; };
  const f = v == null ? 0 : Math.max(0, Math.min(1, v)), [nx, ny] = pt(f, 58);
  return `<svg viewBox="0 0 200 132" width="100%" style="max-width:300px;display:block;margin:0 auto">${seg(0, th.dry, "#DA3A2C")}${seg(th.dry, th.watch, "#F2B01E")}${seg(th.watch, 1, "#2EA05A")}
    ${v == null ? "" : `<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="var(--ink)"/>`}
    <text x="${cx}" y="128" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">${v == null ? "–" : pct(v) + "%"}</text>
    <text x="${cx - R}" y="114" font-size="10.5" font-weight="600" fill="var(--muted)" text-anchor="middle">${esc(T("a_gauge_dry"))}</text><text x="${cx + R}" y="114" font-size="10.5" font-weight="600" fill="var(--muted)" text-anchor="middle">${esc(T("a_gauge_ok"))}</text></svg>`;
}

/* ---------- MAP ---------- */
const gibsDate = (offsetDays) => { const d = new Date(Date.now() - offsetDays * 864e5); return d.toISOString().slice(0, 10); };
function ndviDate() {                         // MODIS 8-day composites start on day 1, 9, 17 … of each year
  const d = new Date(Date.now() - 12 * 864e5), y = d.getUTCFullYear(), doy = Math.floor((d - Date.UTC(y, 0, 0)) / 864e5);
  const start = doy - ((doy - 1) % 8); return new Date(Date.UTC(y, 0, start)).toISOString().slice(0, 10);
}
const STATUS_COLOR = { IRRIGATE: "#2D7FD0", MONITOR: "#F2B01E", WAIT: "#2EA05A" };
async function renderMap(app) {
  const rid = ++S.rid, gd = gibsDate(2);
  app.innerHTML = `<h1>${esc(T("a_map_title"))}</h1><p class="sub" style="margin:0 0 8px">${esc(T("a_map_hint"))}</p>
    <div class="scroll">${[["map", "a_l_map"], ["sat", "a_l_sat"], ["nasa", "a_l_nasa"]].map(([k, l]) => `<span class="chip ${S.layer === k ? "on" : ""}" data-act="layer" data-v="${k}">${esc(T(l))}</span>`).join("")}<span class="chip ${S.ndvi ? "on" : ""}" data-act="ndvi">🌿 ${esc(T("a_l_ndvi"))}</span></div>
    <div class="mapwrap"><div id="map"></div></div>
    <div class="legend"><b style="color:var(--ink)">${esc(T("a_legend"))}:</b>${["IRRIGATE", "MONITOR", "WAIT"].map(s => `<span><i style="background:${STATUS_COLOR[s]}"></i>${esc(T("st_" + s))}</span>`).join("")}</div>
    <div class="small" style="margin-top:8px">${esc(T("a_circle_note"))}${S.layer === "nasa" ? ` · ${esc(T("a_gibs_date"))}: ${gd}` : ""}</div>${S.ndvi ? `<div class="card" style="margin-top:10px"><div class="small" style="color:var(--ink)">🌿 ${esc(T("a_ndvi_note"))} (${ndviDate()})</div></div>` : ""}`;
  if (typeof L === "undefined") { $("#map").innerHTML = `<div class="center">${esc(T("a_error"))}</div>`; return; }
  const sel = S.ctx && (S.ctx.type === "field" ? S.boot.fields.find(f => f.id === S.ctx.id) : meta().regions.find(r => r.id === S.ctx.id));
  const c0 = sel ? [sel.lat, sel.lon] : [41.0, 64.5];
  const map = L.map("map", { zoomControl: false, attributionControl: true }).setView(c0, sel ? 8 : 6); S.map = map;
  L.control.zoom({ position: "topright" }).addTo(map);
  const bases = {
    map: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }),
    sat: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 18, attribution: "Esri World Imagery" }),
    nasa: L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/${gd}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`, { maxZoom: 12, maxNativeZoom: 9, attribution: "NASA GIBS / MODIS Terra" }),
  };
  bases[S.layer].addTo(map);
  if (S.ndvi) L.tileLayer(`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_NDVI_8Day/default/${ndviDate()}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.png`, { maxZoom: 12, maxNativeZoom: 9, opacity: .8, attribution: "NASA GIBS / MODIS NDVI" }).addTo(map);
  if (sel) L.circle([sel.lat, sel.lon], { radius: 25000, color: "#2EA05A", weight: 1.5, fillOpacity: .06, dashArray: "5 5" }).addTo(map);
  try {
    const pts = await api("/map");
    if (rid !== S.rid || S.map !== map) return;
    pts.forEach(p => {
      const col = STATUS_COLOR[p.status] || "#888";
      const m = L.circleMarker([p.lat, p.lon], { radius: p.kind === "field" ? 9 : 12, color: "#fff", weight: 2.5, fillColor: col, fillOpacity: 1 }).addTo(map);
      m.bindTooltip(p.name, { permanent: p.pilot, direction: "top", offset: [0, -8] });
      m.bindPopup(`<b>${esc(p.name)}</b>${p.pilot ? ` <span style="color:#B9820A;font-weight:800;font-size:11px">★ ${esc(T("a_pilot"))}</span>` : ""}<br><span class="tag" style="background:${col};${p.status === "MONITOR" ? "color:#2a1f00" : ""}">${esc(p.status_text)}</span> <span class="tag lv-${p.level}">${esc(T("h_salt"))}: ${esc(p.level_text)}</span><br><button class="mini" style="margin-top:9px" data-act="mapopen" data-t="${p.kind === "field" ? "field" : "area"}" data-v="${esc(p.id)}">${esc(T("a_open"))} →</button>`);
    });
    if (pts.length > 1 && !sel) map.fitBounds(pts.map(p => [p.lat, p.lon]), { padding: [30, 30] });
  } catch (e) { if (rid === S.rid) toast(T("a_error")); }
}

    $("#srcbox").innerHTML = list.map(s => `<div class="src"><b>${esc(s.name)}</b> <span class="small">${esc(s.product)}</span>${s.stale ? ` <span class="tag" style="background:var(--amber);color:#2a1f00">${esc(T("a_stale_tag"))}</span>` : ""}
      <div class="small">${esc(T("a_src_version"))}: ${esc(s.version || T("a_src_na"))} · ${esc(T("a_src_res"))}: ${esc(s.resolution)}<br>${esc(T("a_src_params"))}: ${esc(s.params)}<br>${esc(T("a_src_accessed"))}: ${esc(when(s.accessed))}</div></div>`).join("");
  }).catch(() => { if ($("#srcbox")) $("#srcbox").innerHTML = `<div class="small">${esc(T("a_error"))}</div>`; });
}

/* ---------- sheets ---------- */
function openSheet(html) { closeSheet(); const bg = document.createElement("div"); bg.className = "sheet-bg"; bg.id = "sheet"; bg.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`; bg.addEventListener("click", e => { if (e.target === bg) closeSheet(); }); document.body.appendChild(bg); }
const closeSheet = () => document.querySelectorAll("#sheet").forEach(s => s.remove());

function openForm(f) {
  const isNew = !f;
  const v = f || { name: "", region: S.boot.user.region, crop: "cotton", stage: "mid", groundwater: "unknown", drainage: "unknown", last_flush: "unk", ec: "unk", water: "normal" };
  const today = new Date().toISOString().slice(0, 10);
  S.form = { id: f && f.id, gps: null };
  const sel = (id, tbl, order, cur) => `<select id="${id}">${order.map(k => `<option value="${k}" ${k === cur ? "selected" : ""}>${esc(nm(tbl, k))}</option>`).join("")}</select>`;
  openSheet(`<div class="between"><h1 style="margin:8px 0">${esc(isNew ? T("m_add") : T("a_edit"))}</h1><button class="ghost mini" data-act="closesheet">✕</button></div>
    ${isNew ? `<p class="sub" style="margin:0">${esc(T("a_form_hint"))}</p>` : ""}
    <label>${esc(T("a_f_name"))}</label><input id="fname" maxlength="40" value="${esc(v.name)}" placeholder="${esc(T("ask_fname").replace(/[:：]\s*$/, ""))}">
    <label>${esc(T("a_area"))}</label><select id="fregion">${meta().regions.map(r => `<option value="${r.id}" ${v.region === r.id ? "selected" : ""}>${esc(r.name[S.lang] || r.name.en)}</option>`).join("")}</select>
    <button class="ghost block mini" id="gpsbtn" style="margin-top:8px" data-act="gps">${esc(T("a_f_gps"))}</button>
    <label>${esc(T("a_f_crop"))}</label>${sel("fcrop", "crops", meta().crop_order, v.crop)}<label>${esc(T("a_f_stage"))}</label>${sel("fstage", "stages", meta().stage_order, v.stage)}
    <details class="more"><summary><span>🧂 ${esc(T("a_soil_more"))}</span><i class="chev">›</i></summary><div class="secbody">
    <label>${esc(T("a_f_gw"))}</label>${sel("fgw", "gw", Object.keys(meta().gw), v.groundwater)}<label>${esc(T("a_f_dr"))}</label>${sel("fdr", "dr", Object.keys(meta().dr), v.drainage)}
    <label>${esc(T("a_f_fl"))}</label>${sel("ffl", "fl", Object.keys(meta().fl), v.last_flush)}<label>${esc(T("a_f_ec"))}</label>${sel("fec", "ec", Object.keys(meta().ec), v.ec)}
    <label>${esc(T("a_f_ece"))}</label><div class="row"><input id="fece" inputmode="decimal" placeholder="4.2" value="${v.ece ?? ""}"><input id="fecedate" type="date" value="${v.ece_date || today}" max="${today}" aria-label="${esc(T("a_f_ece_date"))}"></div><div class="small" style="margin-top:4px">${esc(T("a_f_ece_hint"))}</div>
    <label>${esc(T("a_f_wec"))}</label><input id="fwec" inputmode="decimal" placeholder="1.2" value="${v.water_ec ?? ""}"><div class="small" style="margin-top:4px">${esc(T("a_f_wec_hint"))}</div>
    <label>${esc(T("a_water_q"))}</label><select id="fwater">${["normal", "limited", "scarce"].map(w => `<option value="${w}" ${v.water === w ? "selected" : ""}>${esc(T("a_wa_" + w))}</option>`).join("")}</select></div></details>
    <button class="block" style="margin-top:18px;position:sticky;bottom:8px" data-act="saveform">${esc(T("a_save"))}</button>`);
}
async function saveForm() {
  if (S.saving) return;
  const q = id => $("#sheet " + id), name = q("#fname").value.trim();
  if (!name) { q("#fname").focus(); return toast(T("a_need_fname")); }
  const body = { name, crop: q("#fcrop").value, stage: q("#fstage").value, groundwater: q("#fgw").value, drainage: q("#fdr").value, last_flush: q("#ffl").value, ec: q("#fec").value, water: q("#fwater").value };
  if (S.form.gps) { body.lat = S.form.gps[0]; body.lon = S.form.gps[1]; } else body.region = q("#fregion").value;
  const readNum = id => { const t = q(id).value.trim().replace(",", "."); return t === "" ? null : parseFloat(t); };
  const ece = readNum("#fece"), wec = readNum("#fwec");
  if (Number.isNaN(ece) || Number.isNaN(wec) || (ece != null && (ece < 0 || ece > 60)) || (wec != null && (wec < 0 || wec > 30))) return toast(T("a_error"));
  if (ece != null) { body.ece = ece; body.ece_date = q("#fecedate").value || undefined; } else if (S.form.id) body.clear_ece = true;
  if (wec != null) body.water_ec = wec; else if (S.form.id) body.clear_water_ec = true;
  S.saving = true;
  try {
    const f = S.form.id ? await api("/fields/" + S.form.id, "PUT", body) : await api("/fields", "POST", body);
    closeSheet(); haptic(); dropCache(); await load(false); S.ctx = { type: "field", id: f.id }; S.tab = "home"; render();
  } catch (e) { toast(/outside/.test(e.message) ? T("loc_out") : T("a_error")); }
  finally { S.saving = false; }
}
function openSettings() {
  const u = S.boot.user;
  openSheet(`<div class="between"><h1 style="margin:8px 0">⚙️ ${esc(T("a_settings"))}</h1><button class="ghost mini" data-act="closesheet">✕</button></div>
    <label>${esc(T("a_lang"))}</label><div class="grid" style="grid-template-columns:repeat(3,1fr)">${[["uz", "O'zbekcha"], ["ru", "Русский"], ["en", "English"]].map(([c, l]) => `<div class="pill ${S.lang === c ? "on" : ""}" data-act="setlang" data-v="${c}">${l}</div>`).join("")}</div>
    <label>${esc(TL("title"))}</label><div class="grid" style="grid-template-columns:repeat(3,1fr)">${["light", "dark", "auto"].map(k => `<div class="pill ${themePref() === k ? "on" : ""}" data-act="settheme" data-v="${k}">${TL(k)}</div>`).join("")}</div>
    <label>${esc(T("a_area"))}</label><select data-act="setregion">${meta().regions.map(r => `<option value="${r.id}" ${u.region === r.id ? "selected" : ""}>${esc(r.name[S.lang] || r.name.en)}</option>`).join("")}</select>
    <div class="card between" style="margin-top:14px"><b>🔔 ${esc(T("a_notif"))}</b><button class="sw ${u.notify ? "on" : ""}" data-act="setnotify" aria-label="${esc(T("a_notif"))}"></button></div>
    <div class="card"><label style="margin-top:0">${esc(T("a_alert_time"))}</label><select data-act="setalert">${[5, 6, 7, 8, 9, 10].map(h => `<option value="${h}" ${(u.alert_hour || 7) === h ? "selected" : ""}>${String(h).padStart(2, "0")}:00</option>`).join("")}</select><div class="small" style="margin-top:6px">${esc(T("a_alert_hint"))}</div></div>
    <h2 style="margin-top:16px">${esc(T("a_fields_manage"))}</h2>${S.boot.fields.length ? S.boot.fields.map(f => `<div class="between" style="padding:7px 0;border-bottom:1px solid var(--line)"><span>🌾 ${esc(f.name)} <span class="small">${esc(nm("crops", f.crop))}</span></span><span class="row" style="flex:none"><button class="ghost mini" data-act="editfieldid" data-v="${f.id}">✏️</button><button class="danger mini" data-act="delfield" data-v="${f.id}">🗑</button></span></div>`).join("") : `<div class="small">${esc(T("a_no_fields"))}</div>`}
    <button class="ghost block" style="margin-top:12px" data-act="addfield">${esc(T("m_add"))}</button>
    <button class="danger block" style="margin-top:18px" data-act="delacc">${esc(T("s_delete"))}</button>`);
}

/* ---------- data load ---------- */
async function load(draw = true) {
  S.boot = await api("/bootstrap");
  S.lang = S.boot.user.lang || S.lang || "uz";
  if (draw) render();
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const lk = ev.target.closest("[data-link]"); if (lk) { ev.preventDefault(); return openLink(lk.dataset.link); }
  const el = ev.target.closest("[data-act]"); if (!el || el.tagName === "SELECT") return;
  const act = el.dataset.act, v = el.dataset.v;
  try {
    switch (act) {
      case "lang0": S.lang = v; S.boot.user.lang = v; S.step = "about"; render(); break;
      case "step": S.step = v; render(); break;
      case "pickr": S.pickRegion = v; document.querySelectorAll("#rregions .pill").forEach(p => p.classList.toggle("on", p.dataset.v === v)); break;
      case "register": {
        if (S.registering) return;
        const name = $("#rname").value.trim();
        if (name.length < 2) return toast(T("name_bad"));
        if (!S.pickRegion) return toast(T("ask_region"));
        S.registering = true;
        try { await api("/register", "POST", { name, region: S.pickRegion, lang: S.lang }); await load(); S.ctx = null; openForm(null); } finally { S.registering = false; }
        break;
      }
      case "tab": S.tab = v; render(); break;
      case "areas": S.areas = !S.areas; render(); break;
      case "tourdone": LS.set("sr:tour", 1); render(); break;
      case "ctx": S.ctx = { type: el.dataset.t, id: el.dataset.t === "field" ? +v : v }; render(); break;
      case "mapopen": if (S.map) S.map.closePopup(); S.ctx = { type: el.dataset.t, id: el.dataset.t === "field" ? +v : v }; S.tab = "home"; render(); break;
      case "retry": render(); break;
      case "trend": S.trend = +v; render(); break;
      case "refresh": { el.disabled = true; el.textContent = "…"; try { dropCache(); await getData("status", true); toast(T("a_refreshed")); haptic(); } catch (e) { toast(T("a_error")); } render(); break; }
      case "share": {
        const d = S.cache[ctxKey(S.ctx) + ":status"]; if (!d) return;
        const text = T("a_share_text", { name: d.target.name, status: d.text.irrigation_status, reason: d.text.irrigation_reason });
        const url = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/ShorRadarBot") + "&text=" + encodeURIComponent(text);
        tg && tg.openTelegramLink ? tg.openTelegramLink(url) : window.open(url, "_blank"); break;
      }
      case "event": { await api(`/fields/${S.ctx.id}/events`, "POST", { kind: v }); toast(T("a_logged")); haptic(); dropCache(); await load(false); render(); break; }
      case "layer": S.layer = v; render(); break;
      case "ndvi": S.ndvi = !S.ndvi; render(); break;
      case "water": await api(`/fields/${S.ctx.id}`, "PUT", { water: v }); dropCache(); await load(false); render(); break;
      case "pref": {
        const f = S.boot.fields.find(f => f.id === S.ctx.id), set = new Set(f.prefs); set.has(v) ? set.delete(v) : set.add(v);
        await api(`/fields/${S.ctx.id}`, "PUT", { pref_crops: [...set] }); dropCache(); await load(false); render(); break;
      }
      case "addfield": closeSheet(); openForm(null); break;
      case "editfield": openForm(S.boot.fields.find(f => f.id === S.ctx.id)); break;
      case "editfieldid": openForm(S.boot.fields.find(f => f.id === +v)); break;
      case "closesheet": closeSheet(); break;
      case "saveform": await saveForm(); break;
      case "gps":
        if (!navigator.geolocation) return toast(T("a_error"));
        navigator.geolocation.getCurrentPosition(p => { S.form.gps = [p.coords.latitude, p.coords.longitude]; $("#gpsbtn").textContent = T("a_f_gps_ok"); }, () => toast(T("a_error")), { timeout: 10000 });
        break;
      case "settings": openSettings(); break;
      case "settheme": LS.set("sr:theme", v); applyTheme(); openSettings(); break;
      case "setlang": await api("/settings", "POST", { lang: v }); S.lang = v; closeSheet(); dropCache(); await load(); break;
      case "setnotify": await api("/settings", "POST", { notify: !S.boot.user.notify }); await load(false); openSettings(); break;
      case "delfield": confirmBox(T("confirm_del"), async () => { await api("/fields/" + v, "DELETE"); closeSheet(); dropCache(); S.ctx = null; await load(); }); break;
      case "delacc": confirmBox(T("confirm_acc"), async () => { await api("/account", "DELETE"); closeSheet(); S.step = "lang"; S.ctx = null; dropCache(); await load(); }); break;
      case "ask": {
        const box = $("#aians"), input = $("#aiq");
        const q = v === "q" ? (input.value || "").trim() : v === "chip" ? (el.dataset.q || "") : "";
        if (v === "q" && !q) return;
        if (v === "chip") input.value = q;
        const path = S.ctx.type === "field" ? `/fields/${S.ctx.id}/ask` : `/area/${S.ctx.id}/ask`;
        box.textContent = "…"; el.disabled = true;
        try { const r = await api(path, "POST", { question: q }, 50000); box.textContent = r.answer; if (r.ai) { const n = document.createElement("div"); n.className = "small"; n.style.marginTop = "6px"; n.textContent = T("ai_note"); box.appendChild(n); } else toast(T("ai_fallback")); }
        catch (e) { box.textContent = ""; toast(/limit/.test(e.message) ? T("ai_limit") : T("a_error")); }
        el.disabled = false; break;
      }
      case "scope": S.scope = v; render(); break;
      case "post": {
        const text = $("#ptext").value.trim(); if (text.length < 10) return toast(T("post_bad"));
        try { await api("/posts", "POST", { text }); toast(T("post_saved")); haptic(); render(); } catch (e) { toast(/limit/.test(e.message) ? T("post_limit") : T("a_error")); }
        break;
      }
      case "like": { const r = await api(`/posts/${v}/like`, "POST"); el.textContent = "👍 " + r.likes; break; }
      case "report": { const r = await api(`/posts/${v}/report`, "POST"); toast(T(r.new ? "reported" : "reported_already")); break; }
      case "delpost": confirmBox(T("confirm_del"), async () => { await api("/posts/" + v, "DELETE"); render(); }); break;
    }
  } catch (e) { toast(T("a_error")); }
});
document.addEventListener("change", async ev => {
  const t = ev.target, act = t.dataset && t.dataset.act;
  try {
    if (act === "ctxsel" && t.value) { S.ctx = { type: "area", id: t.value }; render(); }
    if (act === "setalert") { await api("/settings", "POST", { alert_hour: +t.value }); await load(false); toast(T("updated")); }
    if (act === "setregion") { await api("/settings", "POST", { region: t.value }); await load(false); toast(T("updated")); }
  } catch (e) { toast(T("a_error")); }
});
if (tg) tg.onEvent("viewportChanged", () => { if (S.map) S.map.invalidateSize(); });

(async () => {
  if (!tg || !tg.initData) {
    $("#hdr").innerHTML = `${mark(32)}${wordmark()}`;
    $("#app").innerHTML = `<div class="center" style="padding-top:60px"><div class="logo">${mark(96)}</div><h1>Sho'r Radar</h1><p class="sub">Telegram → @ShorRadarBot → <b>Open app</b><br>Telegram → @ShorRadarBot → <b>Ilovani ochish</b><br>Telegram → @ShorRadarBot → <b>Открыть приложение</b></p></div>`; return;
  }
  try { await load(); } catch (e) { $("#app").innerHTML = `<div class="center"><p>${esc(e.message)}</p><button data-act="retry">↻</button></div>`; }
})();
</script>
</body>
</html>
